<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><span class="logo">💲 CostPerPrompt</span></header>
  <p class="sub">What this conversation would cost on every major model — using the prompt text visible on the page.</p>
  <label>Your prompt / pasted text (tokens estimated live)
    <textarea id="text" rows="4" placeholder="Paste a prompt here to compare model costs instantly…"></textarea>
  </label>
  <div class="row"><span>Estimated tokens</span><strong id="tokens">0</strong></div>
  <div class="row"><span>Assumed reply</span><strong id="reply">~2× prompt</strong></div>
  <table id="table"><thead><tr><th>Model</th><th>Est. cost</th><th>vs cheapest</th></tr></thead><tbody></tbody></table>
  <h3>Recent sessions</h3>
  <ul id="sessions"></ul>
  <div class="row gap"><button id="export">Export sessions JSON</button><button id="clear">Clear</button><button id="options">Prices</button></div>
  <footer>Powered by <a href="https://pypi.org/project/tokenecon/" target="_blank">tokenecon</a> · Prices are public list, Oct 2026, estimates only.</footer>
  <script src="../pricing.js"></script><script src="../tokenizer.js"></script><script src="popup.js"></script>
</body></html>
